name: Killer Sudoku (Android)

on:
  push:
    paths:
      - "killer-sudoku/**"
      - "killer-sudoku-web/test/fixtures.tsv"
      - ".github/workflows/killer-sudoku-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: killer-sudoku
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und Release-APK bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk KillerSudoku.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KillerSudoku-apk
          path: killer-sudoku/KillerSudoku.apk

      - name: Release mit APK veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: killer-sudoku-${{ github.run_number }}
          name: Killer Sudoku (Build ${{ github.run_number }})
          body: APK herunterladen und auf dem Android-Gerät installieren.
          files: killer-sudoku/KillerSudoku.apk

  # Startet die App im Emulator, spielt ein paar Züge und speichert Screenshots.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KillerSudoku-apk

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash killer-sudoku/tools/smoke-test.sh KillerSudoku.apk screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KillerSudoku-screenshots
          path: screenshots
